name: Enforce Governance Trigger

on:
  push:
    paths:
      - 'governance/**'
      - 'AI-HANDOFF.json'
      - 'scripts/governance/**'
      - '.github/workflows/enforce-governance-trigger.yml'
  pull_request:
    paths:
      - 'governance/**'
      - 'AI-HANDOFF.json'
      - 'scripts/governance/**'
      - '.github/workflows/enforce-governance-trigger.yml'
  workflow_dispatch:

jobs:
  enforce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enforce governance trigger contract
        run: node scripts/governance/enforce-governance-trigger.js .
