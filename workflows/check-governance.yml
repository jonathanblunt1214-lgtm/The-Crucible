name: Check Governance

on:
  workflow_dispatch:
  push:
    paths:
      - 'governance/**'
      - 'AI-HANDOFF.json'
      - 'AI-CONFLICTS.json'
      - 'AGENTS.md'
      - 'DEVLOG.md'
      - '.github/workflows/check-governance.yml'
      - 'scripts/governance/check-governance.js'

jobs:
  check-governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run check governance
        run: node scripts/governance/check-governance.js .
