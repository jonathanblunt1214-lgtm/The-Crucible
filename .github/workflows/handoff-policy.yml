name: AI handoff policy

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  handoff:
    name: AI handoff policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a current DEVLOG handoff
        env:
          HANDOFF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HANDOFF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run audit:handoff
