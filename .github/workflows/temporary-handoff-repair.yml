name: Temporary handoff route repair

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/temporary-handoff-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact development tip
        uses: actions/checkout@v6
        with:
          ref: development
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the evidence-backed handoff correction
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const handoffPath = 'AI-HANDOFF.json';
          const devlogPath = 'DEVLOG.md';
          const handoff = JSON.parse(fs.readFileSync(handoffPath, 'utf8'));
          const oldReason = 'The Crucible-side work updates governance handoff and Devlog records on the owner-approved development path while AI Collaboration remains an independent peer project.';
          if (handoff.activePlan?.taskRouting?.reason !== oldReason) {
            throw new Error(`Refusing stale repair: unexpected taskRouting.reason: ${handoff.activePlan?.taskRouting?.reason}`);
          }
          handoff.activePlan.taskRouting.reason = 'The canonical task-category dispatcher selected crucible-core for stable repository ID 1344890806 on the owner-approved development branch; this Crucible-side governance work remains independent from the peer AI Collaboration project.';
          handoff.activePlan.lastUpdatedAt = new Date().toISOString();
          handoff.activePlan.currentStep = 'Repair the canonical task-category dispatcher wording caught by exact hosted Self-Test evidence, then run the full bounded Final Verification suite before writing the terminal Devlog boundary.';
          handoff.activePlan.steps = handoff.activePlan.steps.map((step) =>
            step.startsWith('[in progress] Restore those seven released claim identifiers')
              ? step.replace('[in progress]', '[done]')
              : step
          );
          handoff.activePlan.steps.splice(
            Math.max(0, handoff.activePlan.steps.length - 3),
            0,
            '[in progress] Restore the exact canonical task-category dispatcher wording required by the checked-in routing invariant, then rerun executable verification without weakening the checker.'
          );
          fs.writeFileSync(handoffPath, `${JSON.stringify(handoff, null, 2)}\n`);

          let devlog = fs.readFileSync(devlogPath, 'utf8');
          devlog = devlog.replace(
            /- \*\*Actual current step:\*\*.*\n/,
            '- **Actual current step:** Exact hosted Self-Test evidence found one correctable route-accountability mismatch: the active handoff retained the canonical category/repository/branch but its reason no longer named the canonical task-category dispatcher. This repair restores that wording without changing routing logic or weakening the test.\n'
          );
          devlog = devlog.replace(
            /- \*\*Verification state:\*\*.*\n/,
            '- **Verification state:** Final Verification restarted from exact commit `4352ddcaa44a88c7a8fa23321ad74c6dfc89b1ba`. Hosted Self-Test run `34740323675` failed only the checked-in active-handoff canonical-route assertion after the broader affected suite passed; this workflow applies only that evidence-backed handoff correction before rerunning the governed verification set.\n'
          );
          const marker = '- Final Verification on `a0b440ce7c9b964a491595680966fee0b514146c` then exposed `CRU-0035`:';
          const markerIndex = devlog.indexOf(marker);
          if (markerIndex === -1) throw new Error('Refusing stale repair: current correction-cycle marker not found in DEVLOG.md');
          const markerEnd = devlog.indexOf('\n', markerIndex);
          const repairLine = '- Exact hosted Self-Test run `34740323675` on `4352ddcaa44a88c7a8fa23321ad74c6dfc89b1ba` then exposed one additional deterministic defect: `test/taskRouting.test.js` expected the active handoff reason to name the canonical `task-category dispatcher`, while the checked-in reason omitted that phrase. The canonical category, stable repository ID, repository, and development branch were already correct; this correction changes only the stale reason text and preserves the checker — exit 1 correction required.\n';
          if (!devlog.includes(repairLine.trim())) {
            devlog = `${devlog.slice(0, markerEnd + 1)}${repairLine}${devlog.slice(markerEnd + 1)}`;
          }
          fs.writeFileSync(devlogPath, devlog.endsWith('\n') ? devlog : `${devlog}\n`);
          NODE

      - name: Focused route and custody verification
        run: |
          node --test test/taskRouting.test.js
          npm run audit:handoff
          npm run audit:coordination
          npm run audit:ai-conflict-governance

      - name: Full governed verification
        run: |
          npm run test:all
          npm run validate
          npm run lint:workflows
          npm run docs:check
          npm run audit:privacy
          npm run audit:security
          npm run audit:github-security
          npm run audit:circulation
          npm run audit:failure-codes
          npm run audit:governance

      - name: Remove temporary transport before terminal record
        run: rm .github/workflows/temporary-handoff-repair.yml

      - name: Write terminal handoff and canonical Devlog record
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runId = process.env.RUN_ID;
          const handoffPath = 'AI-HANDOFF.json';
          const devlogPath = 'DEVLOG.md';
          const handoff = JSON.parse(fs.readFileSync(handoffPath, 'utf8'));
          handoff.activePlan.steps = handoff.activePlan.steps.map((step) =>
            step.startsWith('[in progress] Restore the exact canonical task-category dispatcher wording')
              ? step.replace('[in progress]', '[done]')
              : step
          );
          handoff.activePlan.steps.push(`[done] Final Verification for the safely correctable Crucible route/handoff defect completed in hosted repair run ${runId}: focused routing, handoff, coordination, conflict-governance, full governed tests, validation, workflow lint, docs, privacy, security, GitHub-security, circulation, failure-code, and governance checks all exited 0 before this terminal record.`);
          handoff.activePlan.currentStep = 'Terminal verified boundary reached for the safely correctable Crucible route/handoff defect. Preserve the remaining external AI Collaboration pre-runner Actions blocker and separately governed Crucible vetted-custody blocker for continuation; no substantive mutation follows this terminal record.';
          handoff.activePlan.lastUpdatedAt = new Date().toISOString();
          handoff.handoffNotes.verification.push(`Hosted repair run ${runId} completed the bounded executable Final Verification suite after restoring the canonical task-category dispatcher wording; every invoked focused and full governed check exited 0 before the terminal Devlog/handoff record.`);
          handoff.handoffNotes.remaining = handoff.handoffNotes.remaining.filter((item) => !item.startsWith('Run exact-tip hosted handoff, coordination, and Self-Test verification after the accountability correction') && !item.startsWith('Record the terminal Devlog/handoff boundary'));
          fs.writeFileSync(handoffPath, `${JSON.stringify(handoff, null, 2)}\n`);

          let devlog = fs.readFileSync(devlogPath, 'utf8');
          devlog = devlog.replace(
            /- \*\*Actual current step:\*\*.*\n/,
            '- **Actual current step:** Terminal verified boundary reached for the safely correctable Crucible route/handoff regression. Remaining work is limited to separately evidenced external/custody blockers and later authorized backlog; no substantive mutation follows this terminal record.\n'
          );
          devlog = devlog.replace(
            /- \*\*Verification state:\*\*.*\n/,
            `- **Verification state:** **Verified** for the safely correctable Crucible route/handoff correction. Hosted repair run \`${runId}\` passed focused task-routing, handoff, coordination, AI-conflict governance, the full governed test suite, validate, workflow lint, docs, privacy, security, GitHub-security, circulation, failure-code, and governance checks before this terminal record. Overall cross-project rollout remains **Reviewed** only where AI Collaboration still fails before runner assignment and Crucible hosted learning remains held by its independent vetted-custody queue/manifest boundary.\n`
          );
          devlog = devlog.replace(
            /- \*\*Continuation boundary:\*\*.*\n/,
            '- **Continuation boundary:** Resume only from this verified repository boundary. Do not repeat the corrected route/handoff work. Continue the AI Collaboration pre-runner Actions blocker only with an administrative surface that can expose the setting, and continue Crucible hosted learning only after the independent custody queue/manifest is self-consistent. Preserve all gates and project identities.\n'
          );
          const sessionHeading = '### Session: canonical orchestrator correction cycle — 2026-09-13T05:06:01Z — ChatGPT automation — mode:work';
          const nextSession = devlog.indexOf('\n### Session:', devlog.indexOf(sessionHeading) + sessionHeading.length);
          if (nextSession === -1) throw new Error('Current session boundary not found');
          const terminalLine = `- Final Verification completed in hosted repair run \`${runId}\` after the canonical task-category dispatcher wording was restored. Focused routing/handoff/coordination/conflict-governance checks and the full governed verification command set all exited 0. This terminal Devlog/handoff record is the final state-changing operation for this execution boundary; AI Collaboration's pre-runner Actions failure and Crucible's vetted-custody learning blocker remain explicitly unverified rather than being papered over — exit 0 verified boundary.\n`;
          devlog = `${devlog.slice(0, nextSession)}${terminalLine}\n${devlog.slice(nextSession + 1)}`;
          fs.writeFileSync(devlogPath, devlog.endsWith('\n') ? devlog : `${devlog}\n`);
          NODE

      - name: Commit terminal verified boundary
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI-HANDOFF.json DEVLOG.md .github/workflows/temporary-handoff-repair.yml
          git diff --cached --check
          git commit -m 'Restore canonical task route handoff wording'
          git push origin HEAD:development
