name: Recover Crucible from canonical snapshot

# This workflow used to trigger automatically on every failed Self-Test run
# on main and force-push a recovery commit with no human involved. That is
# invisible self-repair - exactly what this project's own agent-boundaries
# policy prohibits everywhere else - so the automatic trigger has been
# removed. A human decides a real recovery is warranted, supplies the exact
# failing commit SHA, and runs this manually; it still verifies the
# restored tree before promoting it, and still force-pushes with a lease
# scoped to that exact SHA so it can never clobber unrelated newer work.
on:
  workflow_dispatch:
    inputs:
      failed_sha:
        description: The exact failing commit SHA on main to recover from
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crucible-internal-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'jonathanblunt1214-lgtm/The-Crucible'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.failed_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Restore the complete tracked tree from the canonical snapshot
        shell: bash
        env:
          FAILED_SHA: ${{ inputs.failed_sha }}
        run: |
          git fetch origin main crucible-canonical
          test "$(git rev-parse HEAD)" = "$FAILED_SHA"
          test "$(git rev-parse origin/main)" = "$FAILED_SHA"
          git read-tree --reset -u origin/crucible-canonical
          if git diff --cached --quiet; then
            echo 'The failed tree already matches the canonical snapshot; refusing an empty recovery loop.'
            exit 1
          fi
          git config user.name 'The Crucible Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Recover Crucible from verified canonical snapshot"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify the restored tree before promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRUCIBLE_SECURITY_READ_TOKEN: ${{ secrets.SECURITY_READ_TOKEN }}
          CRUCIBLE_WORKFLOW_LINT_DIRS: templates
        run: |
          npm test
          npm run validate
          npm run lint:workflows
          npm run audit:circulation
          npm run audit:clutter
          npm run audit:privacy
          npm run audit:security
      - name: Preserve the recovery branch and promote it atomically
        shell: bash
        env:
          FAILED_SHA: ${{ inputs.failed_sha }}
          RECOVERY_BRANCH: crucible-recovery-${{ github.run_id }}
        run: |
          git push origin HEAD:"refs/heads/$RECOVERY_BRANCH"
          git push origin HEAD:refs/heads/main --force-with-lease=refs/heads/main:"$FAILED_SHA"
