# Keeps the `ci-monitor` branch's tree in sync with `development` on every
# development push - see AGENTS.md's "Automatic CI monitoring" section and
# PR #11. Deliberately does NOT fetch or fast-forward development's actual
# commits onto ci-monitor: it commits a fresh snapshot of development's
# tree on top of ci-monitor's own, separate commit history every time.
# PR #9 (ci-monitor's predecessor, which pointed its head directly at the
# development branch ref) was auto-merged and auto-closed by GitHub without
# anyone touching its merge button, the moment development's exact tip
# commit became reachable from main through an unrelated promotion (via
# the `release` branch). Because ci-monitor's commits here are always new,
# distinct commit objects - never development's real ones - they can never
# become reachable from main through any future promotion, so that
# incident cannot repeat. Never change this workflow to merge, rebase, or
# fast-forward ci-monitor from development directly.
name: Sync CI monitoring branch

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ci-monitor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci-monitor
          fetch-depth: 0
      - name: Replace the tree with development's current content and commit
        run: |
          set -euo pipefail
          git fetch origin development --depth=1
          git rm -rf --ignore-unmatch . >/dev/null
          git checkout origin/development -- .
          git add -A
          if git diff --cached --quiet; then
            echo "ci-monitor already matches development's content - nothing to sync."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync monitoring branch content with development (${{ github.sha }})"
            git push origin HEAD:refs/heads/ci-monitor
          fi
