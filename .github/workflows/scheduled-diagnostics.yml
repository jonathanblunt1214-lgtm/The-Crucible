# Additive, report-only diagnostics on a cadence slower than every push.
# Category cadence is owned by the Orchestrator. This workflow only tells
# the Orchestrator which cadence window fired; it never selects test files.
name: Scheduled diagnostics (cadence tiers)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Scheduled category cadence to run (every-push, daily, twice-weekly, weekly, monthly)
        required: false
        default: daily
        type: string
  schedule:
    - cron: '0 7 * * *'    # daily
    - cron: '0 8 * * 2,5'  # twice weekly (Tuesdays and Fridays)
    - cron: '0 9 * * 1'    # weekly (Mondays)
    - cron: '0 10 1 * *'   # monthly (1st of the month)

permissions:
  contents: read

jobs:
  diagnostics:
    name: Run scheduled Orchestrator cadence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CRUCIBLE_SECURITY_READ_TOKEN: ${{ secrets.SECURITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Determine which cadence window fired
        id: tier
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tier="${{ inputs.tier }}"
          else
            case "${{ github.event.schedule }}" in
              '0 7 * * *') tier=daily ;;
              '0 8 * * 2,5') tier=twice-weekly ;;
              '0 9 * * 1') tier=weekly ;;
              '0 10 1 * *') tier=monthly ;;
              *) tier=daily ;;
            esac
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "[The Crucible] Scheduled diagnostics: passing cadence window $tier to the Orchestrator."
      - name: Run Orchestrator-owned scheduled category cadence
        run: node src/testCadence.js scheduled "${{ steps.tier.outputs.tier }}"
