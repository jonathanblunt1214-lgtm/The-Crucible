name: Nexus plugin v0.0.1

on:
  push:
    branches: [Plug-in]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
      - run: npm test
      - run: npm run package
      - name: Verify Nexus package is runtime-only
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('dist/the-crucible-0.1.0.nexusplugin','utf8')); if(p.format!=='nexus-plugin-package'||p.version!==1||p.pluginId!=='the-crucible') process.exit(1); const paths=p.files.map(f=>f.path); for(const required of ['nexus.plugin.json','index.js','README.md','sbom.spdx.json']) if(!paths.includes(required)) process.exit(1); if(paths.some(x=>x.startsWith('test/')||x.startsWith('scripts/'))) process.exit(1);"
      - name: Upload unsigned screened-source candidate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-crucible-nexus-plugin-0.1.0-${{ github.sha }}
          path: dist/the-crucible-0.1.0.nexusplugin
          if-no-files-found: error
          retention-days: 30

  canonical-core-reference:
    name: Canonical main compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out canonical Crucible core from default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: canonical-crucible
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify canonical core remains healthy
        working-directory: canonical-crucible
        run: npm run test:all
