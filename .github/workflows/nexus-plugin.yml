name: Nexus plugin v0.0.1

on:
  push:
    branches: [Plug-in]
    paths:
      - 'nexus-plugin/**'
      - '.github/workflows/nexus-plugin.yml'
      - 'AI-HANDOFF.json'
      - 'DEVLOG.md'
  pull_request:
    paths:
      - 'nexus-plugin/**'
      - '.github/workflows/nexus-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Verify plugin source contract
        working-directory: nexus-plugin
        run: node scripts/verify.js
      - name: Run plugin VM and lifecycle tests
        working-directory: nexus-plugin
        run: node --test test/*.test.js
      - name: Build deterministic unsigned package
        working-directory: nexus-plugin
        run: node scripts/package.js
      - name: Verify package output exists
        shell: bash
        run: test -f nexus-plugin/dist/the-crucible-0.0.1.nexusplugin.json
      - name: Upload unsigned screened-source candidate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-crucible-nexus-plugin-0.0.1-${{ github.sha }}
          path: nexus-plugin/dist/the-crucible-0.0.1.nexusplugin.json
          if-no-files-found: error
          retention-days: 30

  core-regression:
    name: Core Crucible regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run test:all
      - run: npm run lint:workflows
      - run: npm run docs:check
      - run: npm run audit:ai-conflict-governance
      - run: npm run audit:security
      - run: npm run audit:privacy
