name: Daily governed Perplexity discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: read

concurrency:
  group: perplexity-research-development
  cancel-in-progress: false

jobs:
  discover:
    name: Fill the candidate URL holding queue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRUCIBLE_LEARNING_PROJECT_ID: github:jonathanblunt1214-lgtm/The-Crucible
      CRUCIBLE_LEARNING_ROOT: .hosted-perplexity-research
      CRUCIBLE_SOURCE_QUEUE: .hosted-perplexity-research/source-queue.json
      CRUCIBLE_PERPLEXITY_MAX_QUERIES: '50'
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      PERPLEXITY_MODEL: ${{ secrets.PERPLEXITY_MODEL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: development
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Restore project-bound discovery state and holding queue
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hosted-perplexity-research
          key: perplexity-research-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            perplexity-research-${{ github.repository_id }}-
      - name: Install locked dependencies
        run: npm ci
      - name: Initialize the candidate-only holding queue
        run: npm run learning:perplexity-research-init
      - name: Run up to 50 due topics, each due once daily
        shell: bash
        run: |
          set -euo pipefail
          npm run learning:perplexity-research -- \
            'Android' 'JavaScript' 'HTML' 'CSS' 'Batchfile' 'PowerShell' 'Python' 'TypeScript' \
            'Shell and Bash' 'C' 'C#' 'C++' 'Django' 'Java' 'React' 'React Native' \
            | tee .hosted-perplexity-research/latest-report.json
      - name: Save project-bound discovery state and holding queue
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .hosted-perplexity-research
          key: perplexity-research-${{ github.repository_id }}-${{ github.run_id }}
      - name: Retain the bounded candidate holding report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perplexity-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .hosted-perplexity-research/latest-report.json
            .hosted-perplexity-research/automated-perplexity-research.json
            .hosted-perplexity-research/source-queue.json
          if-no-files-found: error
          retention-days: 30
