name: The Crucible

on:
  workflow_call:
    inputs:
      core_ref:
        description: Exact The-Crucible commit SHA used by the caller
        required: true
        type: string
      config_path:
        description: Configuration path in the caller repository
        required: false
        default: .thecrucible.json
        type: string
      run_workload:
        description: Run configured prepare, verification, stress, and artifact checks
        required: false
        default: true
        type: boolean
      weekly_maintenance:
        description: Verify and safely repack the runner checkout Git objects
        required: false
        default: false
        type: boolean
      dependency_review:
        description: Review pull-request dependency changes for vulnerabilities and invalid sources
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: The Crucible
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CRUCIBLE_REPORT_PATH: ${{ runner.temp }}/the-crucible-report.json
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out the pinned Crucible engine
        uses: actions/checkout@v6
        with:
          repository: jonathanblunt1214-lgtm/The-Crucible
          ref: ${{ inputs.core_ref }}
          path: .the-crucible-runtime
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Initialize project report
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
        run: node .the-crucible-runtime/src/cli.js report-init
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && inputs.dependency_review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
      - name: Validate .thecrucible.json
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js validate
      - name: Enforce configuration and exception governance
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js governance
      - name: Pre-check changed commit and code
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
          CRUCIBLE_COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .the-crucible-runtime/src/cli.js precheck
      - name: Check tracked repository clutter
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js clutter
      - name: Block personal identifiers and credentials
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js privacy
      - name: Run Security Gate
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js security
      - name: Verify evidence-backed project claims
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js authenticity
      - name: Check for overlapping open pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js collisions
      - name: Run verification and bounded workload
        if: inputs.run_workload
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js run
      - name: Perform weekly Git integrity and safe repacking
        if: inputs.weekly_maintenance
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js maintain
      - name: Save Crucible report with this workflow run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-crucible-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/the-crucible-report.json
          if-no-files-found: warn
          retention-days: 90
