name: The Crucible

on:
  workflow_call:
    inputs:
      core_ref:
        description: Exact The-Crucible commit SHA used by the caller
        required: true
        type: string
      config_path:
        description: Configuration path in the caller repository
        required: false
        default: .thecrucible.json
        type: string
      run_workload:
        description: Run configured prepare, verification, stress, and artifact checks
        required: false
        default: true
        type: boolean
      weekly_maintenance:
        description: Verify and safely repack the runner checkout Git objects
        required: false
        default: false
        type: boolean
    secrets:
      security_read_token:
        description: >-
          Optional fine-grained PAT with read-only "Administration" repository
          permission, used only to check Dependabot/secret-scanning settings.
          GITHUB_TOKEN cannot be granted this access (there is no such
          `permissions:` key), so without this secret the check reports
          "unable to verify" rather than a false pass or a workflow error.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: The Crucible
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check out the pinned Crucible engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jonathanblunt1214-lgtm/The-Crucible
          ref: ${{ inputs.core_ref }}
          path: .the-crucible-runtime
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate .thecrucible.json
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js validate
      - name: Lint GitHub Actions workflow permissions
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js workflow-lint
      - name: Pre-check changed commit and code
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
          CRUCIBLE_COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .the-crucible-runtime/src/cli.js precheck
      - name: Check tracked repository clutter
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js clutter
      - name: Block personal identifiers and credentials
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js privacy
      - name: Run Security Gate
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js security
      - name: Check required GitHub repository security settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRUCIBLE_SECURITY_READ_TOKEN: ${{ secrets.security_read_token }}
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js github-security
      - name: Verify evidence-backed project claims
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js authenticity
      - name: Check for overlapping open pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js collisions
      - name: Run verification and bounded workload
        if: inputs.run_workload
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js run
      - name: Perform weekly Git integrity and safe repacking
        if: inputs.weekly_maintenance
        env:
          CRUCIBLE_PROJECT_ROOT: ${{ github.workspace }}
          CRUCIBLE_CONFIG: ${{ inputs.config_path }}
        run: node .the-crucible-runtime/src/cli.js maintain
