name: Third-branch main-reference integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-branch-integrity-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-integrity:
    name: Third-branch main-reference integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Fetch branch tips for read-only reference validation
        shell: bash
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Verify third-branch references to canonical main
        run: node src/referenceBranchIntegrity.js
